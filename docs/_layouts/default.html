<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - BeautsGO Korean Beauty Booking</title>
  <meta name="description" content="{{ page.description | default: 'Book Korean beauty appointments with BeautsGO' }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #333; line-height: 1.7; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .header a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2em; }
    .header .back { font-size: 0.9em; opacity: 0.85; }
    .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
    h2 { margin-bottom: 16px; color: #333; }
    ul, ol { padding-left: 20px; }
    li { margin-bottom: 8px; }
    a { color: #667eea; }
    .tip { background: #f0f7ff; border-left: 4px solid #667eea; padding: 12px 16px; margin-top: 20px; border-radius: 0 8px 8px 0; }
    .link-btn {
      display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 10px 24px; border-radius: 25px; text-decoration: none;
      font-weight: bold; margin-top: 16px; transition: transform 0.2s;
    }
    .link-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

<div class="header">
  <a href="{{ site.baseurl }}/">🏥 BeautsGO Booking</a>
  <a href="{{ site.baseurl }}/" class="back">← All Clinics</a>
</div>

<div class="container">
  {{ content }}
</div>

</body>
</html>
